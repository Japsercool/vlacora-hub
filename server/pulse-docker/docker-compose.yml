name: pulse

services:
  postgres:
    image: ${PULSE_POSTGRES_IMAGE:-postgres:17-alpine}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PULSE_POSTGRES_DB:-pulse}
      POSTGRES_USER: ${PULSE_POSTGRES_USER:-pulse_app}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - pulse_postgres:/var/lib/postgresql/data
    networks:
      - pulse_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PULSE_POSTGRES_USER:-pulse_app} -d ${PULSE_POSTGRES_DB:-pulse}"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 10s
    security_opt:
      - no-new-privileges:true

  postgrest:
    image: ${PULSE_POSTGREST_IMAGE:-postgrest/postgrest:v12.2.12}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./data/postgrest/postgrest.conf:/etc/postgrest.conf:ro
    command: ["/etc/postgrest.conf"]
    networks:
      - pulse_internal
    security_opt:
      - no-new-privileges:true

  gateway:
    build:
      context: ../pulse-data-gateway
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    depends_on:
      postgres:
        condition: service_healthy
      postgrest:
        condition: service_started
    environment:
      PORT: 8787
      PULSE_PUBLIC_URL: ${PULSE_PUBLIC_URL}
      PULSE_ALLOWED_ORIGIN: ${PULSE_ALLOWED_ORIGIN}
      PULSE_GATEWAY_PUBLIC_URL: ${PULSE_GATEWAY_PUBLIC_URL:-}
      SUPABASE_AUTH_URL: ${SUPABASE_AUTH_URL}
      SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY}
      PULSE_GATEWAY_SETUP_TOKEN_FILE: /run/secrets/gateway_setup_token
      PULSE_GATEWAY_MASTER_KEY_FILE: /run/secrets/gateway_master_key
      PULSE_POSTGRES_AUTOCONFIG: "1"
      PULSE_POSTGRES_HOST: postgres
      PULSE_POSTGRES_PORT: 5432
      PULSE_POSTGRES_DB: ${PULSE_POSTGRES_DB:-pulse}
      PULSE_POSTGRES_USER: ${PULSE_POSTGRES_USER:-pulse_app}
      PULSE_POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      PULSE_POSTGRES_SSL: "0"
      PULSE_POSTGREST_URL: http://postgrest:3000
      PULSE_POSTGREST_JWT_SECRET_FILE: /run/secrets/postgrest_jwt_secret
      PULSE_FILE_ROOT: /pulse/files
      PULSE_FILE_MIGRATION_STRICT: "1"
      PULSE_SOURCE_STORAGE_BUCKET: ${PULSE_SOURCE_STORAGE_BUCKET:-vlacora-hub-files}
    secrets:
      - postgres_password
      - gateway_setup_token
      - gateway_master_key
      - postgrest_jwt_secret
    volumes:
      - ./data/files:/pulse/files
      - ./data/gateway:/app/data
      - ./backups:/pulse/backups
    networks:
      - pulse_internal
      - pulse_edge
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/health/live').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  caddy:
    image: ${PULSE_CADDY_IMAGE:-caddy:2.10-alpine}
    restart: unless-stopped
    profiles: ["https"]
    depends_on:
      gateway:
        condition: service_healthy
    environment:
      PULSE_GATEWAY_DOMAIN: ${PULSE_GATEWAY_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - pulse_caddy_data:/data
      - pulse_caddy_config:/config
    networks:
      - pulse_edge
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true

networks:
  pulse_internal:
    internal: true
  pulse_edge:

volumes:
  pulse_postgres:
    name: pulse_postgres
  pulse_caddy_data:
    name: pulse_caddy_data
  pulse_caddy_config:
    name: pulse_caddy_config

secrets:
  postgres_password:
    file: ./secrets/postgres_password.txt
  gateway_setup_token:
    file: ./secrets/gateway_setup_token.txt
  gateway_master_key:
    file: ./secrets/gateway_master_key.txt
  postgrest_jwt_secret:
    file: ./secrets/postgrest_jwt_secret.txt
